backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

locale: de

collections:
  - name: "blog"
    label: "Blog Artikel"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Titel", name: "title", widget: "string", hint: "Keine Gedankenstriche oder Trennstriche (-) verwenden." }
      - { label: "Datum", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Zuletzt aktualisiert", name: "dateModified", widget: "datetime", format: "YYYY-MM-DD", required: false, hint: "Leer lassen, wenn identisch mit Datum" }
      - label: "Kategorie"
        name: "category"
        widget: "select"
        options:
          - { label: "Verkauf & Strategie", value: "verkauf" }
          - { label: "Exposé & Präsentation", value: "expose" }
          - { label: "Fotografie", value: "fotografie" }
          - { label: "Rechtliches", value: "rechtliches" }
          - { label: "Preisfindung", value: "preisfindung" }
          - { label: "Willhaben Tipps", value: "willhaben" }
          - { label: "Steuer", value: "steuer" }
          - { label: "Kosten", value: "kosten" }
      - { label: "Kurzbeschreibung", name: "excerpt", widget: "text", hint: "Kurze Zusammenfassung für die Blog-Übersicht (1-2 Sätze)" }
      - { label: "Meta-Description (SEO)", name: "description", widget: "text", required: false, hint: "Für Google & KI-Suchmaschinen. Leer lassen, dann wird die Kurzbeschreibung verwendet. Keine Gedankenstriche oder Trennstriche (-) verwenden, stattdessen Komma oder Punkt." }
      - { label: "Autor", name: "author", widget: "string", default: "ImmoLotse", required: false }
      - { label: "Lesedauer (Minuten)", name: "readtime", widget: "number", default: 5 }
      - { label: "Titelbild", name: "image", widget: "image", required: false }
      - { label: "Inhalt", name: "body", widget: "markdown" }
      - label: "Häufige Fragen (FAQ)"
        name: "faq"
        widget: "list"
        required: false
        hint: "Optional. Erzeugt einen FAQPage-Eintrag für Google & KI-Suchmaschinen."
        fields:
          - { label: "Frage", name: "question", widget: "string" }
          - { label: "Antwort", name: "answer", widget: "text" }
      - { label: "Veröffentlicht", name: "published", widget: "boolean", default: true }
