[build]
  command = "npm install && npx @11ty/eleventy"
  publish = "."

[build.processing]
  skip_processing = false

[build.processing.images]
  compress = false

# ── Alte Artikel-URLs (post.html?slug=xxx) auf neue /ratgeber/xxx/ umleiten ──
[[redirects]]
  from = "/post.html?slug=:slug"
  to = "/ratgeber/:slug/"
  status = 301
  force = true

[[redirects]]
  from = "/post.html"
  to = "/blog.html"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Content-Security-Policy = "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval'; img-src 'self' https: data:; font-src 'self' https://fonts.gstatic.com; frame-ancestors 'self'"
