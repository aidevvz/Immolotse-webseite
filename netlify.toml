[build]
  command = "npm install && npx @11ty/eleventy"
  publish = "."

[build.processing]
  skip_processing = false

[build.processing.images]
  compress = false

# ── Alte Artikel-URLs (post.html?slug=xxx) auf neue /ratgeber/xxx/ umleiten ──
[[redirects]]
  from = "/post.html?slug=:slug"
  to = "/ratgeber/:slug/"
  status = 301
  force = true

[[redirects]]
  from = "/post.html"
  to = "/blog"
  status = 301
  force = true

# ── Alte .html-Pfade auf saubere URLs umleiten (301) ──
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/blog.html"
  to = "/blog"
  status = 301
  force = true

[[redirects]]
  from = "/shop.html"
  to = "/shop"
  status = 301
  force = true

[[redirects]]
  from = "/ueber-uns.html"
  to = "/ueber-uns"
  status = 301
  force = true

[[redirects]]
  from = "/impressum.html"
  to = "/impressum"
  status = 301
  force = true

# ── Saubere URLs intern auf die .html-Dateien rendern (200, kein Redirect) ──
[[redirects]]
  from = "/blog"
  to = "/blog.html"
  status = 200

[[redirects]]
  from = "/shop"
  to = "/shop.html"
  status = 200

[[redirects]]
  from = "/ueber-uns"
  to = "/ueber-uns.html"
  status = 200

[[redirects]]
  from = "/impressum"
  to = "/impressum.html"
  status = 200

# ── Alte Artikel-URL mit Umlauten auf neuen sauberen Slug umleiten ──
[[redirects]]
  from = "/ratgeber/immobilie-privat-verkaufen-in-österreich-der-ratgeber-2026/"
  to = "/ratgeber/immobilie-privat-verkaufen-oesterreich/"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Content-Security-Policy = "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval'; img-src 'self' https: data:; font-src 'self' https://fonts.gstatic.com; frame-ancestors 'self'"
